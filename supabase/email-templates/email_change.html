<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme o novo e-mail — OperaRoute</title>
  </head>
  <body style="margin:0;padding:0;background:#0a0e16;font-family:Arial,Helvetica,sans-serif;color:#e8edf5;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0a0e16;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#111722;border:1px solid rgba(196,165,116,0.28);border-radius:18px;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 12px;border-bottom:1px solid rgba(255,255,255,0.06);">
                <p style="margin:0;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#c4a574;">OperaRoute</p>
                <h1 style="margin:12px 0 0;font-size:28px;line-height:1.15;font-weight:600;color:#f4efe6;">Confirme o novo e-mail</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 28px 8px;">
                <p style="margin:0 0 22px;font-size:15px;line-height:1.6;color:#94a3b8;">
                  Você solicitou a alteração do e-mail da conta para <strong style="color:#e8d5b0;">{{ .NewEmail }}</strong>. Confirme clicando no botão abaixo.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 22px;">
                  <tr>
                    <td style="border-radius:12px;background:#c4a574;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;font-size:14px;font-weight:700;color:#0a0e16;text-decoration:none;">
                        Confirmar novo e-mail
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0;font-size:13px;line-height:1.55;color:#64748b;">
                  Se você não pediu essa mudança, ignore esta mensagem.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 28px 28px;">
                <p style="margin:0;font-size:12px;color:#64748b;">Equipe OperaRoute · operaroute.com.br</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
